<section class="upload-grid">
  <!-- ── Left: drop area (idle) / preview (file selected) ── -->
  @if (selectedFile() && previewUrl()) {
    <div class="preview-card" [class.preview-card--loading]="isLoading()">
      <div class="preview-card__head">
        <span class="preview-card__caption">Imagem da nota</span>
        <span class="preview-card__badge">
          <mat-icon>document_scanner</mat-icon> Pronta para enviar
        </span>
      </div>

      <div class="preview-card__stage">
        <img class="preview-card__image" [src]="previewUrl()!" [alt]="selectedFile()!.name" />
      </div>

      <div class="preview-card__footer">
        <span class="preview-card__thumb"><mat-icon>photo_camera</mat-icon></span>
        <span class="preview-card__meta">
          <span class="preview-card__name">{{ selectedFile()!.name }}</span>
          <span class="preview-card__size">{{ formatFileSize(selectedFile()!.size) }}</span>
        </span>
        <label class="btn-ghost" for="file-input">
          Trocar
          <input
            type="file"
            id="file-input"
            accept="image/jpeg,image/png,image/webp"
            (change)="onFileChange($event)"
            hidden
          />
        </label>
        <button
          type="button"
          class="preview-card__remove"
          [disabled]="isLoading()"
          (click)="onRemoveFile()"
          aria-label="Remover arquivo"
        ><mat-icon>close</mat-icon></button>
      </div>
    </div>
  } @else {
    <label class="dropzone" for="file-input">
      <span class="dropzone__icon"><mat-icon>cloud_upload</mat-icon></span>
      <span class="dropzone__text">
        <span class="dropzone__title">Arraste a foto da nota aqui</span>
        <span class="dropzone__subtitle">ou clique para escolher um arquivo do computador</span>
      </span>
      <span class="dropzone__cta">
        <mat-icon>photo_camera</mat-icon> Selecionar arquivo
      </span>
      <span class="dropzone__hint">JPG · PNG · WEBP — máx 10 MB</span>
      <input
        type="file"
        id="file-input"
        accept="image/jpeg,image/png,image/webp"
        (change)="onFileChange($event)"
        class="dropzone__input"
        hidden
      />
    </label>
  }

  <!-- ── Right: config rail ── -->
  <div class="config-rail">
    <span class="config-rail__label">Formato da lista</span>

    <div class="format-list" role="radiogroup" aria-label="Formato da lista">
      @for (f of formats; track f.id) {
        <button
          type="button"
          class="format-opt"
          role="radio"
          [attr.aria-checked]="format() === f.id"
          [class.format-opt--active]="format() === f.id"
          [disabled]="isLoading()"
          (click)="format.set(f.id)"
        >
          <mat-icon class="format-opt__icon">{{ f.icon }}</mat-icon>
          <span class="format-opt__text">
            <span class="format-opt__name">{{ f.label }}</span>
            <span class="format-opt__hint">{{ f.hint }}</span>
          </span>
          <span class="format-opt__radio"></span>
        </button>
      }
    </div>

    @if (fileSizeError()) {
      <p class="upload-error" role="alert">{{ fileSizeError() }}</p>
    }

    <button
      class="btn-submit"
      type="button"
      [class.btn-submit--disabled]="!selectedFile() || isLoading()"
      [disabled]="!selectedFile() || isLoading()"
      (click)="onSubmit()"
    >
      <mat-icon>auto_awesome</mat-icon>
      {{ selectedFile() ? 'Extrair lista' : 'Selecione uma imagem' }}
    </button>
  </div>
</section>
