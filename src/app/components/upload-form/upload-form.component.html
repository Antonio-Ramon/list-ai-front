<section class="upload-form">
  <span class="upload-label">Selecione a Nota Fiscal</span>

  @if (selectedFile() && previewUrl()) {
    <div class="file-preview" [class.file-preview--loading]="isLoading()">
      <div class="file-preview__image-wrap">
        <img
          class="file-preview__image"
          [src]="previewUrl()!"
          [alt]="selectedFile()!.name"
        />
      </div>
      <div class="file-preview__footer">
        <span class="file-preview__dot"></span>
        <span class="file-preview__name">{{ selectedFile()!.name }}</span>
        <span class="file-preview__size">{{ formatFileSize(selectedFile()!.size) }}</span>
        <button
          type="button"
          class="file-preview__remove"
          [disabled]="isLoading()"
          (click)="onRemoveFile()"
          aria-label="Remover arquivo"
        ><mat-icon>close</mat-icon></button>
      </div>
    </div>
  } @else {
    <label
      class="upload-zone"
      for="file-input"
    >
      <mat-icon class="upload-zone__icon">upload_file</mat-icon>
      <span class="upload-zone__primary">SELECIONAR ARQUIVO</span>
      <span class="upload-zone__secondary">JPG · PNG · WEBP — máx 10 MB</span>
      <input
        type="file"
        id="file-input"
        accept="image/jpeg,image/png,image/webp"
        (change)="onFileChange($event)"
        class="upload-zone__input"
      />
    </label>
  }

  @if (fileSizeError()) {
    <p class="upload-error" role="alert">{{ fileSizeError() }}</p>
  }

  <span class="upload-label">Formato da lista</span>

  <div class="format-toggle" role="group" aria-label="Formato da lista">
    <button
      type="button"
      class="format-toggle__btn"
      [class.format-toggle__btn--active]="format() === 'checklist'"
      [disabled]="isLoading()"
      (click)="format.set('checklist')"
    ><mat-icon>checklist</mat-icon> Checklist</button>
    <button
      type="button"
      class="format-toggle__btn"
      [class.format-toggle__btn--active]="format() === 'asterisk'"
      [disabled]="isLoading()"
      (click)="format.set('asterisk')"
    ><mat-icon>format_list_bulleted</mat-icon> Asterisco</button>
    <button
      type="button"
      class="format-toggle__btn"
      [class.format-toggle__btn--active]="format() === 'simple'"
      [disabled]="isLoading()"
      (click)="format.set('simple')"
    ><mat-icon>list</mat-icon> Simples</button>
    <button
      type="button"
      class="format-toggle__btn"
      [class.format-toggle__btn--active]="format() === 'excel'"
      [disabled]="isLoading()"
      (click)="format.set('excel')"
    ><mat-icon>table_chart</mat-icon> Excel</button>
  </div>

  <button
    class="btn-submit"
    type="button"
    [disabled]="!selectedFile() || isLoading()"
    (click)="onSubmit()"
  >
    <mat-icon>auto_awesome</mat-icon> EXTRAIR LISTA
  </button>
</section>
