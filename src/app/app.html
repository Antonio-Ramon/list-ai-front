<div class="accent-bar" aria-hidden="true"></div>

<div class="app-container">
  <header class="app-header">
    <span class="app-tag">AI-POWERED</span>
    <h1 class="app-title">List <span class="app-title__ai">AI</span></h1>
    <p class="app-subtitle">Escaneie sua nota fiscal e obtenha a lista de compras extraída por inteligência artificial.</p>
  </header>

  @if (hasResult()) {
    <la-result-card
      [hasResult]="hasResult()"
      [items]="items()"
      [text]="resultText()"
      (back)="onBack()"
    />
  } @else {
    <la-upload-form
      [isLoading]="isLoading()"
      (fileSelected)="onFileSelected($event)"
      (fileRemoved)="onFileRemoved()"
      (submitted)="onSubmit($event)"
    />

    <la-error-message [message]="errorMessage()" />

    @if (isLoading()) {
      <div class="loading-bop" role="status" aria-label="Processando nota fiscal">
        <div class="loading-bop__bars" aria-hidden="true">
          <span class="loading-bop__bar"></span>
          <span class="loading-bop__bar"></span>
          <span class="loading-bop__bar"></span>
          <span class="loading-bop__bar"></span>
          <span class="loading-bop__bar"></span>
        </div>
        <p class="loading-bop__message">{{ loadingMessage() }}</p>
      </div>
    }
  }
</div>
